# Codemagic builds the iPhone app on a Mac in the cloud (this project is developed on Windows).
#
# ios-test: an UNSIGNED .ipa for installing on your own iPhone with Sideloadly and a free Apple ID.
# API_BASE_URL is the production API on Azure; change it in the workflow environment on codemagic.io to test against another server.
# (e.g. http://<your PC IP>:5264 to use the API running on your PC on the same Wi-Fi)
workflows:
  ios-test:
    name: iPhone test build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      vars:
        API_BASE_URL: https://fitplan-api-eyad.azurewebsites.net
    working_directory: Frontend/fitplan_app
    scripts:
      # the generated .freezed.dart / .g.dart files are committed, so no build_runner step
      - name: Get packages
        script: flutter pub get
      - name: Build the app without signing (Sideloadly signs it with your Apple ID)
        script: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Package as .ipa
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -qr FitPlan-test.ipa Payload
    artifacts:
      # one of these matches, depending on whether Codemagic resolves it from the working directory
      - build/ios/ipa/*.ipa
      - Frontend/fitplan_app/build/ios/ipa/*.ipa
