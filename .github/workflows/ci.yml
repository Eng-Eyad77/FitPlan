# Checks every pull request into develop or main, and runs first in deploy workflows.
# It builds no iOS or Android app (docs/WORKFLOW.md), and it never signs in to Azure:
# the only database is a throwaway container on the runner.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

# A new push replaces the checks of an older push on the same pull request.
# A deploy's checks have their own group and are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FitPlan.slnx
      - run: dotnet build FitPlan.slnx --configuration Release --no-restore -p:SourceRevisionId=$GITHUB_SHA
      - name: Start a throwaway SQL Server
        # The password is random for this run, masked in the logs, and reachable only from this runner.
        run: |
          password="Fp1-$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run --detach --name fitplan-test-sql \
            --env ACCEPT_EULA=Y --env MSSQL_SA_PASSWORD="$password" \
            --publish 127.0.0.1:1433:1433 \
            mcr.microsoft.com/mssql/server:2025-latest > /dev/null
          for attempt in $(seq 1 30); do
            if docker exec --env SQLCMDPASSWORD="$password" fitplan-test-sql \
              /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready after attempt $attempt"
              echo "FITPLAN_TEST_SQL=Server=127.0.0.1,1433;User ID=sa;Password=$password;TrustServerCertificate=True;" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "::error::SQL Server did not become ready"
          docker logs --tail 40 fitplan-test-sql
          exit 1
      - run: dotnet test FitPlan.slnx --configuration Release --no-build
        env:
          FITPLAN_EXPECTED_COMMIT: ${{ github.sha }}

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend/fitplan_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
